[project]
name = "personal-pat"
version = "0.1.0"
description = "Personal Investment Research Agent — espinha dorsal de dados (Fase 0)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "duckdb>=1.0",
    # Exigido pelo DuckDB para materializar TIMESTAMPTZ em datetime do Python.
    # Sem ele, a alternativa seria gravar timestamps ingenuos, o que quebraria
    # a garantia de timezone dos contratos.
    "pytz>=2024.1",
    "anthropic>=0.122.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pat = "pat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." poe a raiz no path para que os helpers sejam importados como
# `tests.conftest`, com nome qualificado. Importar `conftest` solto colide
# assim que existe mais de um conftest.py na arvore de testes.
pythonpath = ["src", "."]
addopts = "-q -m 'not network'"
markers = ["network: exige acesso a rede (fontes publicas reais)"]
