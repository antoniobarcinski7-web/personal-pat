# Netflix, Inc. (CIK 0001065280, ticker NFLX).
#
# O SEGUNDO mapeamento americano, e ele existe em boa parte para provar que o
# primeiro nao virou familia por acidente: a Netflix escolhe elementos
# DIFERENTES da Intel para as MESMAS linhas. Receita e `Revenues` aqui e
# `RevenueFromContractWithCustomerExcludingAssessedTax` la; custo e
# `CostOfRevenue` aqui e `CostOfGoodsAndServicesSold` la. Nenhum sistema que
# casasse elemento por semelhanca acertaria as duas.
#
# Conferido contra o `companyfacts` da SEC ja no bronze (sha256 00f34490...,
# 3,4 MB), nos exercicios FY2023 e FY2024, ambos encerrados em 31 de dezembro
# - ao contrario da Intel, a Netflix usa ano-calendario.

mapping_id      = "us:cik:0001065280"
mapping_version = "v1"
framework       = "us_gaap"
taxonomy        = "us-gaap.xbrl"
jurisdiction    = "US"
source          = "sec.companyfacts"
entity_id       = "us:cik:0001065280"

verified_by      = "antonio.barcinski"
verified_against = "SEC companyfacts CIK 0001065280, FY2023 e FY2024, 10-K"

# ---------------------------------------------------------------------------
# Receita
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "revenue_net"
fidelity   = "exact"
equivalence_basis = """
A Netflix usa `Revenues`, o elemento generico de receita do us-gaap. A Intel \
NAO o usa - ela publica `RevenueFromContractWithCustomerExcludingAssessedTax`. \
As duas companhias reportam a mesma grandeza economica sob elementos \
diferentes, e essa e a razao pela qual nao existe familia us-gaap neste \
projeto: cada emissor ganha o seu arquivo, e a equivalencia e afirmada uma vez \
por emissor.

A Netflix nao cobra tributos sobre venda separadamente na apresentacao da \
receita (o modelo de assinatura recolhe imposto indireto em algumas \
jurisdicoes, apresentado liquido), entao `Revenues` ja e receita liquida - a \
definicao de `revenue_net`.

Conferido: FY2023 US$ 33.723,3 MM, FY2024 US$ 39.001,0 MM. Os dois batem com a \
demonstracao de resultado do 10-K.

Positivo na origem, ja na convencao do conceito; sign=+1.
"""
[[binding.line]]
element   = "Revenues"
statement = "income"
sign      = 1
label_as_reported = "Revenues"

# ---------------------------------------------------------------------------
# Custo
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "cogs"
fidelity   = "exact"
equivalence_basis = """
`CostOfRevenue` e o custo de receita da Netflix: majoritariamente amortizacao \
de conteudo, mais custos de entrega (CDN, pagamento, royalties). E o outro \
elemento valido para a mesma linha que a Intel resolveu com \
`CostOfGoodsAndServicesSold` - de novo, a escolha e do emissor.

Publicado POSITIVO (US$ 21.038,5 MM em FY2024), na mesma convencao do conceito \
("positivo = despesa"). Sign=+1, sem inversao.

Conferido pela identidade da propria demonstracao, ver o binding de \
`operating_expenses_net`.

NOTA PARA QUEM FOR MEXER EM D&A: a amortizacao de conteudo mora AQUI DENTRO, e \
nao numa linha de D&A. Ver a secao "Por que d_and_a_pnl NAO esta ligado" no fim \
deste arquivo antes de tentar somar D&A de volta a este numero.
"""
[[binding.line]]
element   = "CostOfRevenue"
statement = "income"
sign      = 1
label_as_reported = "Cost of revenues"

# ---------------------------------------------------------------------------
# Despesas operacionais
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "operating_expenses_net"
fidelity   = "exact"
equivalence_basis = """
A Netflix NAO publica `OperatingExpenses` como total anual - ela apresenta as \
tres despesas operacionais separadamente, abaixo do custo de receita. Este \
binding soma as tres, com sign=+1 em cada:

    SellingAndMarketingExpense        marketing
    ResearchAndDevelopmentExpense     technology and development
    GeneralAndAdministrativeExpense   general and administrative

Somar linhas publicadas e diferente de estimar um total: as tres sao exatamente \
o que a companhia apresenta entre o custo e o resultado operacional, e a \
identidade fecha ATE O ULTIMO DIGITO nos dois exercicios conferidos:

  FY2024  39.000.966 - 21.038.464 - 2.917.554 - 2.925.295 - 1.702.039
        = 10.417.614  = `OperatingIncomeLoss` publicado
  FY2023  33.723.297 - 19.715.368 - 2.657.883 - 2.675.758 - 1.720.285
        = 6.954.003   = `OperatingIncomeLoss` publicado

Fechar exatamente e o que autoriza `fidelity = "exact"` aqui. Se sobrasse \
residual, o honesto seria `approximate` com `divergence_note`.

`ResearchAndDevelopmentExpense` carrega o que a Netflix chama de "technology \
and development" - o rotulo do emissor difere do nome do elemento, e e por isso \
que `label_as_reported` existe e que a busca nunca e por rotulo.
"""
[[binding.line]]
element   = "SellingAndMarketingExpense"
statement = "income"
sign      = 1
label_as_reported = "Marketing"
[[binding.line]]
element   = "ResearchAndDevelopmentExpense"
statement = "income"
sign      = 1
label_as_reported = "Technology and development"
[[binding.line]]
element   = "GeneralAndAdministrativeExpense"
statement = "income"
sign      = 1
label_as_reported = "General and administrative"

# ---------------------------------------------------------------------------
# Resultado operacional
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "ebit_reported"
fidelity   = "exact"
equivalence_basis = """
`OperatingIncomeLoss` e o resultado operacional como a Netflix o apresenta, \
antes do resultado financeiro e dos tributos. E exatamente `ebit_reported`, e \
segue a decisao A1: o que a companhia poe acima da linha operacional fica \
dentro.

A Netflix nao tem equivalencia patrimonial relevante, entao a ressalva que \
domina o caso do GPA nao se aplica aqui - o que nao muda a definicao, so o \
tamanho do efeito.

Conferido: FY2023 US$ 6.954,0 MM, FY2024 US$ 10.417,6 MM.
"""
[[binding.line]]
element   = "OperatingIncomeLoss"
statement = "income"
sign      = 1
label_as_reported = "Operating income"

# ---------------------------------------------------------------------------
# Resultado atribuivel a controladora
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "net_income_controlling"
fidelity   = "exact"
equivalence_basis = """
`NetIncomeLoss` e, no us-gaap, o resultado ATRIBUIVEL AOS SOCIOS DA \
CONTROLADORA - a armadilha de nomenclatura ja registrada no mapeamento da \
Intel. O total, incluindo nao controladores, seria `ProfitLoss`, e a decisao A3 \
mantem os dois separados sem fallback automatico.

A Netflix nao tem participacao de nao controladores material, entao os dois \
coincidem na pratica. Isso NAO e razao para relaxar a regra: coincidir hoje e \
diferente de ser a mesma coisa, e uma aquisicao futura separaria os dois sem \
avisar ninguem.

Conferido: FY2023 US$ 5.408,0 MM, FY2024 US$ 8.712,0 MM.
"""
[[binding.line]]
element   = "NetIncomeLoss"
statement = "income"
sign      = 1
label_as_reported = "Net income"

# ---------------------------------------------------------------------------
# Balanco
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "cash_and_equivalents"
fidelity   = "exact"
equivalence_basis = """
`CashAndCashEquivalentsAtCarryingValue` e a linha de caixa e equivalentes do \
balanco, pelo valor contabil. Saldo pontual, `PeriodType.INSTANT`.

Conferido: 2023-12-31 US$ 7.116,9 MM, 2024-12-31 US$ 7.804,7 MM.

NAO inclui `ShortTermInvestments` (US$ 21,0 MM em 2023 e US$ 1.779,0 MM em \
2024). O salto entre os dois anos e justamente por que os conceitos sao \
separados: somar produziria uma serie de caixa que sobe 2,6x quando a companhia \
so mudou onde aplicou o dinheiro.
"""
[[binding.line]]
element   = "CashAndCashEquivalentsAtCarryingValue"
statement = "balance"
sign      = 1
label_as_reported = "Cash and cash equivalents"

[[binding]]
concept_id = "short_term_investments"
fidelity   = "exact"
equivalence_basis = """
`ShortTermInvestments` e a linha de aplicacoes financeiras do ativo circulante \
que nao atende ao criterio de equivalente de caixa.

Conferido: 2023-12-31 US$ 21,0 MM, 2024-12-31 US$ 1.779,0 MM.
"""
[[binding.line]]
element   = "ShortTermInvestments"
statement = "balance"
sign      = 1
label_as_reported = "Short-term investments"

[[binding]]
concept_id = "debt_current"
fidelity   = "exact"
equivalence_basis = """
A Netflix NAO usa `LongTermDebtCurrent` nem `DebtCurrent` para a parcela \
circulante da divida - ela usa `ShortTermBorrowings`. Mais um elemento onde a \
escolha e do emissor e nenhuma deducao acertaria.

Conferido: 2023-12-31 US$ 399,8 MM, 2024-12-31 US$ 1.784,5 MM. O salto e real - \
sao os notes com vencimento em 2025 reclassificados para o circulante.

Divida ONEROSA, sem arrendamento: o passivo de arrendamento tem binding proprio \
em `lease_liability_current`, conforme a decisao A4.
"""
[[binding.line]]
element   = "ShortTermBorrowings"
statement = "balance"
sign      = 1
label_as_reported = "Short-term debt"

[[binding]]
concept_id = "debt_noncurrent"
fidelity   = "exact"
equivalence_basis = """
`LongTermDebtNoncurrent` e a divida de longo prazo, liquida de custos de \
emissao. A Netflix tambem publica `LongTermDebt` em alguns periodos - aquele e \
o TOTAL, e usa-lo aqui contaria a parcela circulante duas vezes quando somada a \
`debt_current`.

Conferido: 2023-12-31 US$ 14.143,4 MM, 2024-12-31 US$ 13.798,4 MM.

Divida bruta resultante: 14.543,3 MM em 2023 e 15.582,8 MM em 2024, que batem \
com o total de divida do 10-K.
"""
[[binding.line]]
element   = "LongTermDebtNoncurrent"
statement = "balance"
sign      = 1
label_as_reported = "Long-term debt"

# ---------------------------------------------------------------------------
# Arrendamento (decisao A4: explicito, nunca embutido)
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "lease_liability_current"
fidelity   = "exact"
equivalence_basis = """
`OperatingLeaseLiabilityCurrent`. So arrendamento OPERACIONAL - a Netflix nao \
publica passivo de arrendamento financeiro material.

Conferido: 2023-12-31 US$ 383,3 MM, 2024-12-31 US$ 428,5 MM.
"""
[[binding.line]]
element   = "OperatingLeaseLiabilityCurrent"
statement = "balance"
sign      = 1
label_as_reported = "Current content liabilities / operating lease"

[[binding]]
concept_id = "lease_liability_noncurrent"
fidelity   = "exact"
equivalence_basis = """
`OperatingLeaseLiabilityNoncurrent`.

Conferido: 2023-12-31 US$ 2.046,8 MM, 2024-12-31 US$ 1.983,7 MM.

Com arrendamento, a divida bruta de 2024 sobe de 15.582,8 para 17.995,0 MM - \
15% a mais. E o tamanho do efeito que a decisao A4 existe para nao esconder.
"""
[[binding.line]]
element   = "OperatingLeaseLiabilityNoncurrent"
statement = "balance"
sign      = 1
label_as_reported = "Operating lease liabilities"

# ---------------------------------------------------------------------------
# Fluxo de caixa
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "cash_flow_operating"
fidelity   = "exact"
equivalence_basis = """
`NetCashProvidedByUsedInOperatingActivities` e o caixa liquido das atividades \
operacionais, publicado POSITIVO quando gera caixa - a mesma convencao do \
conceito. Sign=+1.

Conferido: FY2023 US$ 7.274,3 MM, FY2024 US$ 7.361,4 MM.
"""
[[binding.line]]
element   = "NetCashProvidedByUsedInOperatingActivities"
statement = "cash_flow"
sign      = 1
label_as_reported = "Net cash provided by operating activities"

[[binding]]
concept_id = "capex"
fidelity   = "partial"
divergence_note = """
Este capex e SO imobilizado - US$ 439,5 MM em FY2024 - e NAO inclui o \
investimento em conteudo, que na Netflix e a alocacao de capital que decide a \
companhia: US$ 16.223,6 MM no mesmo exercicio, 37 vezes maior.

A razao NAO e falta de dado, e isso mudou: \
`nflx:AdditionstoStreamingContentAssets` esta no gold desde que \
`parse_inline_xbrl` passou a ler o inline XBRL do 10-K. A razao e contabil.

A Netflix classifica o gasto com conteudo nas atividades OPERACIONAIS, e nao \
nas de investimento. Some-lo aqui faria `fcf@v1` - que e caixa operacional \
menos capex - subtrair o conteudo DUAS vezes: uma dentro do caixa operacional, \
onde ele ja esta, e outra como capex. O FCF sairia US$ 16 bilhoes menor do que \
e.

Consequencia declarada: `fcf@v1` para a Netflix ja esta LIQUIDO do gasto com \
conteudo. O numero e util e NAO e comparavel com o FCF de uma companhia que \
capitaliza conteudo como investimento - a diferenca nao esta no calculo, esta \
em onde cada emissor classifica o mesmo desembolso. Por isso a fidelidade e \
`partial`: a marca sobe pelo grafo ate o `MetricResult`, e quem comparar duas \
companhias ve o aviso.
"""
equivalence_basis = """
`PaymentsToAcquirePropertyPlantAndEquipment` e o desembolso com imobilizado nas \
atividades de investimento. Publicado POSITIVO no companyfacts (a SEC usa \
elemento de "payments", cujo sinal ja e de saida), e a convencao do conceito e \
"positivo = saida de caixa". Sign=+1, sem inversao.

Conferido: FY2023 US$ 348,6 MM, FY2024 US$ 439,5 MM.
"""
[[binding.line]]
element   = "PaymentsToAcquirePropertyPlantAndEquipment"
statement = "cash_flow"
sign      = 1
label_as_reported = "Purchases of property and equipment"

# ---------------------------------------------------------------------------
# Patrimonio e retorno ao acionista
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "equity_controlling"
fidelity   = "exact"
equivalence_basis = """
`StockholdersEquity` e, no us-gaap, o patrimonio ATRIBUIVEL AOS SOCIOS DA \
CONTROLADORA. O total, incluindo nao controladores, e \
`StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest` - a \
mesma armadilha de nomenclatura de `NetIncomeLoss` contra `ProfitLoss`, e a \
mesma decisao A3 resolve as duas.

A Netflix nao tem participacao de nao controladores material, entao os dois \
coincidem. Coincidir hoje nao e ser a mesma coisa, e uma aquisicao futura \
separaria os dois sem avisar ninguem.

Conferido: 2023-12-31 US$ 20.588,0 MM, 2024-12-31 US$ 24.743,6 MM.
"""
[[binding.line]]
element   = "StockholdersEquity"
statement = "balance"
sign      = 1
label_as_reported = "Total stockholders' equity"

[[binding]]
concept_id = "share_repurchases"
fidelity   = "exact"
equivalence_basis = """
`PaymentsForRepurchaseOfCommonStock` e o desembolso com recompra de acoes nas \
atividades de financiamento. Publicado POSITIVO (elemento de "payments"), ja \
na convencao do conceito.

NAO usar `TreasuryStockValueAcquiredCostMethod`, que a Netflix tambem publica: \
aquele e saldo de acoes em tesouraria pelo custo, e muda com cancelamento e \
reemissao. Le-lo como recompra produziria um numero que nao e caixa - o mesmo \
erro de ler capex pela variacao do imobilizado.
"""
[[binding.line]]
element   = "PaymentsForRepurchaseOfCommonStock"
statement = "cash_flow"
sign      = 1
label_as_reported = "Repurchases of common stock"

# ---------------------------------------------------------------------------
# Carga tributaria
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "income_tax_expense"
fidelity   = "exact"
equivalence_basis = """
`IncomeTaxExpenseBenefit` e a despesa de imposto do periodo, corrente mais \
diferida, como reconhecida no resultado. Publicada POSITIVA quando ha despesa, \
ja na convencao do conceito.
"""
[[binding.line]]
element   = "IncomeTaxExpenseBenefit"
statement = "income"
sign      = 1
label_as_reported = "Provision for income taxes"

[[binding]]
concept_id = "pretax_income"
fidelity   = "exact"
equivalence_basis = """
`IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest` \
e o resultado antes dos tributos - o nome longo e do us-gaap, nao uma escolha \
deste arquivo.

E o denominador da aliquota efetiva, e NAO e o EBIT: este ja passou pelo \
resultado financeiro. Usar um pelo outro produziria uma aliquota que nao se \
aplica a nada.
"""
[[binding.line]]
element   = "IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest"
statement = "income"
sign      = 1
label_as_reported = "Income before income taxes"

# ---------------------------------------------------------------------------
# Depreciacao e amortizacao que passou pelo resultado
#
# Duas linhas, e a segunda e a companhia inteira.
# ---------------------------------------------------------------------------
[[binding]]
concept_id = "d_and_a_pnl"
fidelity   = "exact"
equivalence_basis = """
A Netflix reconhece no resultado DUAS despesas de amortizacao/depreciacao de \
naturezas diferentes, e este binding soma as duas:

    DepreciationDepletionAndAmortization                     imobilizado
    nflx:CostofServicesAmortizationofStreamingContentAssets  conteudo

A segunda e a companhia. Em FY2024 sao US$ 15.301,5 MM contra US$ 328,9 MM da \
primeira - 46 vezes maior. Ela e a maior despesa nao-caixa da Netflix, esta \
DENTRO de `CostOfRevenue` na demonstracao, e e por construcao a parcela que \
reduziu o resultado sem consumir caixa - que e exatamente a definicao de \
`d_and_a_pnl`.

POR QUE ISTO NAO EXISTIA ATE AGORA. O elemento e da taxonomia CUSTOMIZADA da \
Netflix, e o endpoint `companyfacts` da SEC publica so taxonomias padrao - \
`us-gaap`, `dei`, `srt`, `ecd`, `ffd`. Nao havia filtro a afrouxar: o dado nao \
estava no JSON. Ele vive no inline XBRL do proprio 10-K, e passou a ser \
legivel quando `parse_inline_xbrl` existiu.

Enquanto nao existia, `ebitda@v1` RECUSAVA - e a recusa estava certa. Um \
EBITDA montado so sobre os 328,9 MM de imobilizado teria saido com \
`fidelity = exact` descrevendo outra empresa.

Conferido:
  FY2023  356,9 + 14.197,4 = 14.554,4 MM
  FY2024  328,9 + 15.301,5 = 15.630,4 MM

Os dois positivos na origem, ja na convencao do conceito; sign=+1 em cada.
"""
[[binding.line]]
element   = "DepreciationDepletionAndAmortization"
statement = "cash_flow"
sign      = 1
label_as_reported = "Depreciation and amortization of property, equipment and intangibles"
[[binding.line]]
element   = "CostofServicesAmortizationofStreamingContentAssets"
statement = "cash_flow"
sign      = 1
label_as_reported = "Amortization of content assets"

# ---------------------------------------------------------------------------
# O QUE NAO ESTA LIGADO, E POR QUE
# ---------------------------------------------------------------------------
#
# gross_profit
# ------------
# A Netflix NAO publica `GrossProfit` como linha anual. Ela vai do custo de
# receita direto para as despesas operacionais. Derivar receita - custo aqui
# daria o numero certo e seria a coisa errada: `gross_profit` e um conceito
# REPORTADO, e o motor tem uma decomposicao propria (`gross_profit_by_line`)
# para quem quiser a derivacao. Ligar um conceito reportado a uma conta que
# ninguem reportou apagaria a distincao entre ler e calcular.
#
# Consequencia aceita: `gross_profit_by_line@v1` e `ebit_by_stage@v1` recusam
# para a Netflix, com motivo nomeado. `ebit_by_line@v1` funciona, porque ela
# nao precisa de lucro bruto.
#
# d_and_a_pnl  -- RESOLVIDO, historico mantido
# --------------------------------------------
# O que segue descreve por que este binding NAO existiu ate a leitura do inline
# XBRL, e fica registrado porque o raciocinio continua valendo para o proximo
# emissor cuja linha decisiva esteja numa taxonomia customizada.
#
# A Netflix publica `DepreciationDepletionAndAmortization`: US$ 328,9 MM em
# FY2024. E tentador ligar, e seria o erro mais caro deste arquivo.
#
# Esse numero e SO a depreciacao de imobilizado. A amortizacao de conteudo -
# que em FY2024 passa de US$ 14 bilhoes e e de longe a maior despesa da
# companhia - e reportada dentro de `CostOfRevenue`, e o elemento que a isola
# vive na taxonomia CUSTOMIZADA da propria Netflix (`nflx:`), que o ingestor
# nao le: `_TAXONOMIAS` em `parse/sec_xbrl.py` cobre `us-gaap` e `ifrs-full`.
#
# Ligar `d_and_a_pnl` a esses 328,9 MM produziria um `ebitda@v1` de cerca de
# US$ 10,7 bi para uma companhia cuja principal despesa nao-caixa foi
# ignorada. O numero sairia com `fidelity = exact`, porque a linha existe e
# esta certa - e estaria descrevendo outra empresa.
#
# Por isso o binding NAO existe. `ebitda@v1` e `d_and_a@v1` devolvem
# `MetricUnavailable` nomeando `d_and_a_pnl` como o conceito que faltou. E a
# regra do projeto aplicada onde ela custa: insumo ausente nunca vira zero,
# nunca vira parcial, e nunca vira um numero plausivel.
#
# O que destravaria: ler a taxonomia `nflx:` no ingestor, ou usar o Financial
# Statement Data Set (DERA), que traz a linha de amortizacao de conteudo. As
# duas sao mudanca de engenharia, e nenhuma se resolve neste arquivo.
#
# dividends_paid
# --------------
# A Netflix NAO paga dividendo, e nunca pagou. Nao ha linha porque nao ha
# desembolso - ausencia que e FATO sobre a companhia, e nao lacuna do sistema.
#
# `dividendos_pagos@v1` recusa nomeando o conceito, e `retorno_ao_acionista@v1`
# recusa junto. Isso e deliberado: apresentar so a recompra sob o nome "retorno
# ao acionista" diria que o dividendo e zero calculado, quando o correto e que
# ele nao existe como linha. A recompra isolada continua disponivel em
# `recompras@v1`, e e ela que responde a pergunta de alocacao de capital aqui.
#
# segmentos
# ---------
# A Netflix reporta receita por REGIAO (UCAN, EMEA, LATAM, APAC), e nao por
# segmento de negocio - ela declara um unico segmento operacional. O eixo
# `BusinessSegments` de `revenue_by_segment@v1` nao se aplica; um eixo
# geografico seria outra decomposicao, com outro nome e outra versao.
