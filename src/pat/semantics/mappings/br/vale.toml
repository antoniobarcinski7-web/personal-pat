[[binding]]
concept_id = "d_and_a_pnl"
fidelity   = "exact"
equivalence_basis = """
6.01.01.06 "Depreciação, amortização e exaustão" e a linha de reversao de D&A na \
conciliacao do fluxo de caixa indireto da Vale: parte do lucro antes dos \
tributos e soma de volta a despesa que nao consumiu caixa. E a D&A reconhecida \
no resultado do periodo - d_and_a_pnl com fidelidade exata, no lugar da \
aproximacao pela DVA que a familia usa.

Positiva na origem (reversao somada ao lucro), ja na convencao do conceito; \
sign=+1.

A exaustao entra aqui junto com depreciacao e amortizacao, e isso e correto \
para uma mineradora: exaustao de mina e consumo de ativo de longo prazo \
reconhecido no resultado, da mesma natureza economica que depreciacao. Nao e \
uma aproximacao - e o mesmo conceito medido sobre uma classe de ativo \
diferente.

Confere com a DVA (7.04.01) em todos os exercicios conferidos: FY2024 16.525 \
MM em ambas, FY2023 15.300 MM em ambas, FY2022 16.386 MM em ambas. A escolha \
do DFC sobre a DVA aqui nao muda o numero hoje; muda a garantia, porque passa \
a apontar para a demonstracao onde a grandeza e definida pelo que atravessou o \
resultado, e nao pelo que foi retido do valor adicionado.

O codigo 6.01.01.06 e especifico da Vale e nao pode subir para a familia. Note \
que na Vale a numeracao de 6.01.01 tem buraco (nao existe .05), o que e mais um \
motivo para nenhuma inferencia posicional.
"""
