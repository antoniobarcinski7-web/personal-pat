<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAT Research</title>
<style>
/* Tema por prefers-color-scheme, sem toggle: estado de tema seria mais um
   lugar onde a UI guarda coisa, e nada nesta pagina se beneficia disso. */
:root {
  color-scheme: light dark;
  --bg: #f7f7f5;
  --panel: #ffffff;
  --panel-2: #f0efec;
  --ink: #1a1a18;
  --ink-dim: #5c5b55;
  --ink-faint: #8a8880;
  --line: #d9d7d0;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --user-bg: #e6ecf2;
  --warn-bg: #fdf4e0;
  --warn-line: #d9a441;
  --warn-ink: #6b4c07;
  --refuse-bg: #f1eef7;
  --refuse-line: #7a63b8;
  --refuse-ink: #3d2f66;
  --error-bg: #fdeaea;
  --error-line: #c0392b;
  --error-ink: #7f2019;
  --interp-bg: #f2f4f0;
  --interp-line: #8fa07c;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14151a;
    --panel: #1b1d23;
    --panel-2: #23262e;
    --ink: #e6e6e3;
    --ink-dim: #a8a89f;
    --ink-faint: #77776f;
    --line: #313641;
    --accent: #6fa8d6;
    --accent-ink: #10141a;
    --user-bg: #23303c;
    --warn-bg: #33290f;
    --warn-line: #b98b28;
    --warn-ink: #f0d9a0;
    --refuse-bg: #262038;
    --refuse-line: #8f7ad0;
    --refuse-ink: #ddd2fb;
    --error-bg: #3a1a17;
    --error-line: #d9584a;
    --error-ink: #f7c9c3;
    --interp-bg: #202519;
    --interp-line: #7d9163;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--sans);
  display: flex;
  flex-direction: column;
}
button {
  font: inherit;
  color: inherit;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 4px 9px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
select, input, textarea {
  font: inherit;
  color: inherit;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 4px 6px;
}
.mono { font-family: var(--mono); font-size: 12.5px; }
.dim { color: var(--ink-dim); }
.faint { color: var(--ink-faint); }

/* ---------- cabecalho ---------- */
header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 18px;
  padding: 9px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
header .brand { font-weight: 600; letter-spacing: .02em; }
header .spacer { flex: 1; }
.kv { font-size: 12.5px; color: var(--ink-dim); }
.kv b { font-weight: 600; color: var(--ink); font-family: var(--mono); }

/* ---------- barra de pinos ---------- */
.pinbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  padding: 8px 16px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 999px;
  padding: 2px 6px 2px 10px;
  font-size: 12.5px;
}
.chip button {
  border: none;
  background: transparent;
  padding: 0 3px;
  line-height: 1;
  color: var(--ink-dim);
}
.pin-hint {
  width: 100%;
  color: var(--warn-ink);
  background: var(--warn-bg);
  border-left: 3px solid var(--warn-line);
  padding: 4px 8px;
  font-size: 12.5px;
}

/* ---------- conversa ---------- */
main {
  flex: 1;
  overflow-y: auto;
  padding: 18px 16px 8px;
}
.thread { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.msg { display: grid; grid-template-columns: 58px 1fr; gap: 12px; }
.who {
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--ink-faint);
  padding-top: 4px;
}
.body-user {
  background: var(--user-bg);
  border-radius: 6px;
  padding: 8px 11px;
  white-space: pre-wrap;
}
.prose p { margin: 0 0 .7em; }
.prose p:last-child { margin-bottom: 0; }

.block {
  border-radius: 6px;
  padding: 8px 11px;
  margin-top: 10px;
  font-size: 13.5px;
}
.block h4 {
  margin: 0 0 5px;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  font-weight: 600;
}
/* Ressalvas ficam sempre abertas: um WarningKind nunca suprime numero, e
   esconde-lo atras de um clique seria o mesmo que suprimi-lo na pratica. */
.warns { background: var(--warn-bg); border-left: 3px solid var(--warn-line); color: var(--warn-ink); }
.warns li { margin-bottom: 3px; }
.warns ul { margin: 0; padding-left: 18px; }
/* Bloco de leituras separado da prosa por construcao: NumericClaim tem campo
   de valor e InterpretiveClaim estruturalmente nao tem. Se os dois dividissem
   o mesmo paragrafo, a distincao entre medido e lido morreria justamente na
   ultima perna, que e onde ela importa. */
.interp { background: var(--interp-bg); border-left: 3px solid var(--interp-line); }
.interp li { margin-bottom: 4px; }
.interp ul { margin: 0; padding-left: 18px; }
/* Recusa tem estilo proprio: nao e resposta e nao e erro de infraestrutura. */
.refusal { background: var(--refuse-bg); border-left: 3px solid var(--refuse-line); color: var(--refuse-ink); }
.refusal .cands { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.failed { background: var(--panel-2); border-left: 3px solid var(--ink-faint); }
.infra { background: var(--error-bg); border-left: 3px solid var(--error-line); color: var(--error-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* Barra indeterminada: nao existe streaming e nao existe progresso real.
   Inventar percentual seria afirmar um numero que o sistema nao conhece. */
.loading { display: flex; flex-direction: column; gap: 6px; }
.bar { height: 3px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 34%; background: var(--accent); animation: slide 1.35s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-105%); } 100% { transform: translateX(310%); } }

/* ---------- composer ---------- */
footer {
  border-top: 1px solid var(--line);
  background: var(--panel);
  padding: 10px 16px;
}
.composer { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 40px; max-height: 180px; line-height: 1.4; }
.composer button.send { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 8px 16px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; }
.scrim.on { display: block; }
aside {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(560px, 100%);
  background: var(--panel);
  border-left: 1px solid var(--line);
  transform: translateX(101%);
  transition: transform .18s ease-out;
  display: flex;
  flex-direction: column;
  z-index: 10;
}
aside.on { transform: none; }
aside .head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
}
aside .head h2 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
aside .head .spacer { flex: 1; }
aside .content { overflow-y: auto; padding: 14px; font-size: 13.5px; }
aside section { margin-bottom: 20px; }
aside section > h3 {
  margin: 0 0 7px; font-size: 11px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-faint);
}
.claim { border-left: 2px solid var(--line); padding: 0 0 0 10px; margin-bottom: 12px; }
.claim .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.claim .val { font-family: var(--mono); font-weight: 600; }
.claim .means { color: var(--ink-dim); font-size: 12.5px; margin-top: 2px; }
.idline { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.idline code { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); word-break: break-all; }
.grid { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; align-items: baseline; }
.grid dt { color: var(--ink-faint); font-size: 12px; }
.grid dd { margin: 0; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
td.m { font-family: var(--mono); }
pre.cmd {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 10px;
  margin: 0;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 12.5px;
}
.repro { border: 1px solid var(--accent); border-radius: 6px; padding: 10px 11px; }
.repro p { margin: 0 0 8px; font-size: 13px; }
.copied { color: var(--accent); font-size: 12px; }

@media (max-width: 640px) {
  .msg { grid-template-columns: 1fr; gap: 3px; }
  header { gap: 4px 12px; }
}
</style>
</head>
<body>

<header>
  <span class="brand">PAT Research</span>
  <span class="kv">AS OF <b id="hdr-asof">—</b></span>
  <span class="kv">capability <b id="hdr-cap">—</b></span>
  <span class="kv">sessão <b id="hdr-session">—</b></span>
  <span class="spacer"></span>
  <button id="btn-new">Nova conversa</button>
</header>

<div class="pinbar">
  <span class="faint">pinos:</span>
  <span id="chips" style="display:contents"></span>
  <select id="sel-entity"><option value="">+ empresa</option></select>
  <select id="sel-period"><option value="">+ período</option></select>
  <label class="faint">escopo
    <select id="sel-scope">
      <option value="">—</option>
      <option value="consolidated">consolidated</option>
      <option value="parent_only">parent_only</option>
    </select>
  </label>
  <span id="pin-hint" class="pin-hint" hidden></span>
</div>

<main><div class="thread" id="thread"></div></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Pergunte ao PAT…  (Enter envia, Shift+Enter quebra linha)"></textarea>
    <button class="send" id="btn-send">Enviar</button>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="head">
    <h2 id="drawer-title">—</h2>
    <span class="spacer"></span>
    <button id="btn-close">Fechar</button>
  </div>
  <div class="content" id="drawer-content"></div>
</aside>

<script>
"use strict";

/* =====================================================================
   PAT — pagina de chat.

   Uma regra atravessa este arquivo inteiro e explica quase todas as
   decisoes abaixo: o modelo interpreta a pergunta e redige o texto, mas
   NUNCA produz um numero. Os valores chegam prontos em `rendered_value`,
   formatados por src/pat/research/render.py, e vao para a tela exatamente
   como vieram. Nao ha aritmetica em JavaScript nesta pagina — nenhuma
   soma, nenhuma variacao, nenhuma reformatacao, nenhuma ordenacao por
   valor. E o que torna a regra verificavel de fora: se a tela nao calcula,
   so pode estar exibindo o que o motor deterministico calculou.

   A segunda regra: prosa vai para o DOM com textContent. A prosa vem de um
   modelo; renderiza-la como markup seria injecao com passos extras. Toda
   estrutura aqui e montada com createElement.
   ===================================================================== */

/* Mock de desenvolvimento: DESLIGADO por default. Serve para abrir o
   arquivo direto no browser (file://) e conferir o layout sem backend.
   Liga-se so com ?mock=1 na URL. Nao ha caminho em que ele substitua uma
   resposta real do servidor. */
const MOCK = new URLSearchParams(location.search).get("mock") === "1";

/* ------------------------------ estado ------------------------------ */

const state = {
  sessionId: null,
  asOf: null,
  capability: null,
  entitiesById: new Map(),
  pins: { entities: [], periods: [], scope: "" },
  turns: [],       // TurnView[] na ordem em que chegaram
  busy: false,
  lastSentText: "",
};

const $ = (id) => document.getElementById(id);

/* --------------------------- utilidades DOM -------------------------- */

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  // Sempre textContent, jamais markup: ver comentario do topo.
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function clear(node) { node.replaceChildren(); }

/* Encurta hash para caber no cabecalho. Corte de string, nao conta. */
function short(value, size) {
  if (!value) return "—";
  const text = String(value);
  const n = size || 8;
  return text.length > n ? text.slice(0, n) + "…" : text;
}

function copyButton(value) {
  const wrap = el("span", "idline");
  const code = el("code", null, value);
  const btn = el("button", null, "copiar");
  const done = el("span", "copied");
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(String(value));
      done.textContent = "copiado";
    } catch (err) {
      done.textContent = "selecione e copie";
    }
    setTimeout(() => { done.textContent = ""; }, 1800);
  });
  wrap.append(code, btn, done);
  return wrap;
}

function dl(pairs) {
  const grid = el("dl", "grid");
  for (const [key, value] of pairs) {
    if (value === undefined || value === null || value === "") continue;
    grid.append(el("dt", null, key), el("dd", null, value));
  }
  return grid;
}

/* ------------------------------- API -------------------------------- */

class ApiError extends Error {
  constructor(status, detail) {
    super(detail || "falha de transporte");
    this.status = status;
    this.detail = detail;
  }
}

async function api(method, path, body) {
  const options = { method, headers: { "Accept": "application/json" } };
  if (body !== undefined) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  let response;
  try {
    response = await fetch(path, options);
  } catch (err) {
    throw new ApiError(0, "não consegui falar com o servidor (pat serve está rodando?)");
  }
  const raw = await response.text();
  let data = null;
  if (raw) { try { data = JSON.parse(raw); } catch (err) { data = null; } }
  if (!response.ok) {
    const detail = (data && (data.detail || data.error || data.message)) || raw.slice(0, 400);
    throw new ApiError(response.status, detail);
  }
  return data;
}

/* ------------------------------ pinos -------------------------------- */
/* Os pinos sao do USUARIO. A pagina nunca os infere de uma resposta
   anterior: pino e soberania sobre o planejador, e um pino que aparece
   sozinho deixa de ser isso. */

function entityLabel(entityId) {
  const card = state.entitiesById.get(entityId);
  return (card && card.denom_cia) || entityId;
}

function addEntityPin(entityId) {
  if (!entityId || state.pins.entities.includes(entityId)) return;
  state.pins.entities.push(entityId);
  renderPins();
}

function addPeriodPin(periodEnd) {
  if (!periodEnd || state.pins.periods.includes(periodEnd)) return;
  state.pins.periods.push(periodEnd);
  renderPins();
}

function renderPins() {
  const box = $("chips");
  clear(box);
  for (const entityId of state.pins.entities) {
    box.append(chip(entityLabel(entityId), () => {
      state.pins.entities = state.pins.entities.filter((x) => x !== entityId);
      renderPins();
    }));
  }
  for (const period of state.pins.periods) {
    box.append(chip(period, () => {
      state.pins.periods = state.pins.periods.filter((x) => x !== period);
      renderPins();
    }));
  }
  $("sel-scope").value = state.pins.scope;
  checkPinConflict();
}

function chip(label, onRemove) {
  const node = el("span", "chip");
  node.append(el("span", null, label));
  const btn = el("button", null, "×");
  btn.title = "remover pino";
  btn.addEventListener("click", onRemove);
  node.append(btn);
  return node;
}

/* Aviso preventivo da §17.4: pino de periodo contradito pelo texto produz
   PIN_CONTRADICTED_PERIOD, que aparece como recusa crua e confunde. Aqui a
   comparacao e de substring de ano, nao de valor. */
function checkPinConflict() {
  const hint = $("pin-hint");
  const text = $("input").value;
  const mentioned = text.match(/\b(?:19|20)\d{2}\b/g) || [];
  const pinnedYears = state.pins.periods.map((p) => String(p).slice(0, 4));
  const clash = mentioned.filter((year) => pinnedYears.length && !pinnedYears.includes(year));
  if (clash.length) {
    hint.hidden = false;
    hint.textContent =
      "você fixou " + pinnedYears.join(", ") + "; a pergunta menciona " +
      clash.join(", ") + " — remova o pino ou reformule.";
  } else {
    hint.hidden = true;
    hint.textContent = "";
  }
}

/* --------------------------- inicializacao ---------------------------- */

async function loadCapability() {
  const cap = MOCK ? MOCK_CAPABILITY : await api("GET", "/api/capability");
  state.capability = cap;
  state.entitiesById = new Map();
  const entities = cap.entities || [];
  for (const card of entities) state.entitiesById.set(card.entity_id, card);
  $("hdr-cap").textContent = short(cap.capability_sha256, 8);

  const selEntity = $("sel-entity");
  clear(selEntity);
  selEntity.append(new Option("+ empresa", ""));
  // Ordenacao por NOME (texto). Nada nesta pagina e ordenado por valor.
  const byName = entities.slice().sort((a, b) =>
    String(a.denom_cia || a.entity_id).localeCompare(String(b.denom_cia || b.entity_id)));
  for (const card of byName) {
    selEntity.append(new Option(card.denom_cia || card.entity_id, card.entity_id));
  }

  const periods = new Set();
  for (const card of entities) for (const p of (card.period_ends || [])) periods.add(p);
  const selPeriod = $("sel-period");
  clear(selPeriod);
  selPeriod.append(new Option("+ período", ""));
  for (const p of Array.from(periods).sort().reverse()) selPeriod.append(new Option(p, p));
}

async function newSession() {
  const data = MOCK
    ? { session_id: "a3f9c10de2b45671", as_of: "2026-08-20", created_at: "2026-08-20T14:00:00Z" }
    : await api("POST", "/api/session", {});
  state.sessionId = data.session_id;
  state.asOf = data.as_of;
  state.turns = [];
  $("hdr-asof").textContent = data.as_of || "—";
  $("hdr-session").textContent = short(data.session_id, 10);
  location.hash = data.session_id;
  clear($("thread"));
  closeDrawer();
  appendSystemNote(
    "Sessão nova. O AS OF da sessão é " + (data.as_of || "?") +
    " — toda consulta desta conversa é point-in-time nessa data.");
}

async function resumeSession(sessionId) {
  const data = await api("GET", "/api/session/" + encodeURIComponent(sessionId));
  state.sessionId = data.session_id;
  state.asOf = data.as_of;
  state.turns = data.turns || [];
  $("hdr-asof").textContent = data.as_of || "—";
  $("hdr-session").textContent = short(data.session_id, 10);
  clear($("thread"));
  for (const turn of state.turns) {
    appendUser(turn.question);
    $("thread").append(renderTurn(turn));
  }
  scrollDown();
}

/* ------------------------------- envio -------------------------------- */

function scrollDown() {
  const main = document.querySelector("main");
  main.scrollTop = main.scrollHeight;
}

function appendSystemNote(text) {
  const row = el("div", "msg");
  row.append(el("div", "who", ""), el("div", "faint", text));
  $("thread").append(row);
}

function appendUser(text) {
  const row = el("div", "msg");
  row.append(el("div", "who", "você"));
  row.append(el("div", "body-user", text));
  $("thread").append(row);
  scrollDown();
}

/* Rotulos progridem por heuristica de tempo porque nao ha streaming: o
   pipeline e atomico de proposito (nao existe resposta parcial antes de
   check_prose passar). Sao rotulos de etapa esperada, nunca percentual. */
const LOADING_STEPS = [
  { at: 0, label: "planejando…" },
  { at: 7000, label: "calculando…" },
  { at: 18000, label: "redigindo…" },
];

function appendPending() {
  const row = el("div", "msg");
  row.append(el("div", "who", "PAT"));
  const box = el("div", "loading");
  const label = el("div", "dim", LOADING_STEPS[0].label);
  const bar = el("div", "bar");
  bar.append(el("i"));
  box.append(label, bar);
  row.append(box);
  $("thread").append(row);
  scrollDown();
  const timers = LOADING_STEPS.slice(1).map((step) =>
    setTimeout(() => { label.textContent = step.label; }, step.at));
  return {
    row,
    stop() { for (const timer of timers) clearTimeout(timer); },
  };
}

function buildRequest(text) {
  const request = { session_id: state.sessionId, text };
  if (state.pins.entities.length) {
    request.pinned_entities = Array.from(new Set(state.pins.entities)).sort();
  }
  if (state.pins.periods.length) {
    request.pinned_periods = Array.from(new Set(state.pins.periods)).sort();
  }
  if (state.pins.scope) request.pinned_scope = state.pins.scope;
  return request;
}

async function send(text) {
  if (state.busy || !text.trim() || !state.sessionId) return;
  state.busy = true;
  $("btn-send").disabled = true;
  state.lastSentText = text;
  appendUser(text);
  const pending = appendPending();
  try {
    const turn = MOCK ? await mockChat(text) : await api("POST", "/api/chat", buildRequest(text));
    pending.stop();
    state.turns.push(turn);
    pending.row.replaceWith(renderTurn(turn));
  } catch (err) {
    pending.stop();
    pending.row.replaceWith(renderInfraError(err, text));
  } finally {
    state.busy = false;
    $("btn-send").disabled = false;
    scrollDown();
  }
}

/* ----------------------------- renderizacao --------------------------- */

function renderTurn(turn) {
  const row = el("div", "msg");
  row.append(el("div", "who", "PAT"));
  const body = el("div");

  if (turn.status === "answered" && turn.answer) {
    body.append(renderAnswer(turn));
  } else if (turn.status === "refused") {
    body.append(renderRefusal(turn));
  } else {
    body.append(renderFailed(turn));
  }

  body.append(renderActions(turn));
  row.append(body);
  return row;
}

function renderAnswer(turn) {
  const wrap = el("div");
  const answer = turn.answer || {};

  // Prosa: paragrafos por quebra dupla, cada um com textContent. Sem
  // markdown e sem HTML — o texto vem de um modelo.
  const prose = el("div", "prose");
  const paragraphs = String(answer.prose || "").split(/\n\s*\n/);
  for (const paragraph of paragraphs) {
    if (paragraph.trim()) prose.append(el("p", null, paragraph.trim()));
  }
  wrap.append(prose);

  const warnings = answer.warnings || [];
  if (warnings.length) wrap.append(renderWarnings(warnings));

  const interpretive = answer.interpretive_claims || [];
  if (interpretive.length) wrap.append(renderInterpretive(interpretive));

  return wrap;
}

function renderWarnings(warnings) {
  const box = el("div", "block warns");
  box.append(el("h4", null, "ressalvas — sempre visíveis, nunca suprimem um número"));
  const list = el("ul");
  for (const warning of warnings) {
    const item = el("li");
    item.append(el("span", "mono", warning.kind || "?"));
    item.append(el("span", null, " · " + (warning.message || "")));
    list.append(item);
  }
  box.append(list);
  return box;
}

function renderInterpretive(claims) {
  // Bloco proprio, com rotulo explicito: e leitura do modelo, nao medicao.
  const box = el("div", "block interp");
  box.append(el("h4", null, "leitura do modelo — não é medição"));
  const list = el("ul");
  for (const claim of claims) {
    const item = el("li", null, claim.text || "");
    const supports = claim.supports || [];
    if (supports.length) {
      const note = el("div", "faint mono");
      note.textContent = "apoia-se em " + supports.map((id) => short(id, 10)).join(", ");
      item.append(note);
    }
    list.append(item);
  }
  box.append(list);
  return box;
}

function renderRefusal(turn) {
  const refusal = turn.refusal || {};
  const box = el("div", "block refusal");
  box.append(el("h4", null, "recusa · " + (refusal.kind || "?")));
  box.append(el("div", null, refusal.summary || "O sistema não respondeu esta pergunta."));
  if (refusal.detail) box.append(el("div", "dim", refusal.detail));

  const codes = refusal.codes || [];
  if (codes.length) {
    box.append(el("div", "mono dim", "códigos: " + codes.join(" · ")));
  }
  const remedies = refusal.remedies || [];
  if (remedies.length) {
    const list = el("ul");
    for (const remedy of remedies) list.append(el("li", null, remedy));
    box.append(el("div", "faint", "o que fazer:"), list);
  }

  // Candidatos viram pinos: quem desambigua e o usuario, nunca o sistema.
  const candidates = refusal.candidates || [];
  if (candidates.length) {
    box.append(el("div", "faint", "fixe um candidato e pergunte de novo:"));
    const bar = el("div", "cands");
    for (const candidate of candidates) {
      const btn = el("button", null, "fixar " + labelForCandidate(candidate));
      btn.addEventListener("click", () => pinCandidate(candidate));
      bar.append(btn);
    }
    box.append(bar);
  }
  return box;
}

function labelForCandidate(candidate) {
  const text = String(candidate);
  if (state.entitiesById.has(text)) return entityLabel(text);
  return text;
}

function pinCandidate(candidate) {
  const text = String(candidate);
  if (state.entitiesById.has(text)) { addEntityPin(text); return; }
  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) { addPeriodPin(text); return; }
  if (text === "consolidated" || text === "parent_only") {
    state.pins.scope = text;
    renderPins();
    return;
  }
  // Candidato que nao casa com nada conhecido: procura por nome de empresa.
  for (const [entityId, card] of state.entitiesById) {
    if (String(card.denom_cia || "").toLowerCase().includes(text.toLowerCase())) {
      addEntityPin(entityId);
      return;
    }
  }
  // Sem casamento: nao inventa pino. O texto vai para a caixa e o usuario decide.
  $("input").value = ($("input").value + " " + text).trim();
  $("input").focus();
}

function renderFailed(turn) {
  const refusal = turn.refusal || {};
  const box = el("div", "block failed");
  box.append(el("h4", null, "o modelo não produziu uma saída válida"));
  box.append(el("div", null, refusal.summary || "PlannerError / WriterError."));
  if (refusal.detail) box.append(el("div", "dim", refusal.detail));
  const provenance = turn.provenance || {};
  const source = provenance.writer || provenance.planner;
  if (source && source.response_sha256) {
    box.append(el("div", "mono dim", "resposta " + short(source.response_sha256, 12)));
  }
  // Retentativa e SEMPRE mensagem nova: retentativa interna seria um segundo
  // caminho de influencia que a procedencia nao registraria.
  const actions = el("div", "actions");
  const retry = el("button", null, "Tentar de novo (nova mensagem)");
  retry.addEventListener("click", () => send(turn.question || state.lastSentText));
  actions.append(retry);
  box.append(actions);
  return box;
}

function renderInfraError(err, text) {
  const row = el("div", "msg");
  row.append(el("div", "who", "PAT"));
  const box = el("div", "block infra");
  const status = err instanceof ApiError && err.status ? " (HTTP " + String(err.status) + ")" : "";
  box.append(el("h4", null, "falha de infraestrutura" + status));
  box.append(el("div", null, err.message || "erro desconhecido"));
  box.append(el("div", "faint",
    "Isto não é uma recusa do PAT: uma recusa volta com 200 e explicação. " +
    "Aqui a requisição não completou."));
  const actions = el("div", "actions");
  const retry = el("button", null, "Tentar de novo (nova mensagem)");
  retry.addEventListener("click", () => send(text));
  actions.append(retry);
  box.append(actions);
  row.append(box);
  return row;
}

function renderActions(turn) {
  const bar = el("div", "actions");
  if (turn.plan) {
    const btn = el("button", null, "Ver plano");
    btn.addEventListener("click", () => openPlan(turn));
    bar.append(btn);
  }
  if (turn.manifest || turn.provenance || (turn.answer && turn.answer.numeric_claims)) {
    const btn = el("button", null, "Ver fontes");
    btn.addEventListener("click", () => openSources(turn));
    bar.append(btn);
  }
  const answer = turn.answer || {};
  const numeric = answer.numeric_claims || [];
  if (numeric.length) {
    bar.append(el("span", "faint", String(numeric.length) + " número(s) citado(s)"));
  }
  if (turn.elapsed_ms !== undefined && turn.elapsed_ms !== null) {
    // String crua do backend. A pagina nao converte ms em segundos: converter
    // seria aritmetica, e aritmetica nesta camada e exatamente o que a
    // arquitetura proibe — mesmo quando o numero e inofensivo.
    bar.append(el("span", "faint mono", String(turn.elapsed_ms) + " ms"));
  }
  return bar;
}

/* ------------------------------- drawer ------------------------------- */

function openDrawer(title) {
  $("drawer-title").textContent = title;
  $("drawer").classList.add("on");
  $("drawer").setAttribute("aria-hidden", "false");
  $("scrim").classList.add("on");
  const content = $("drawer-content");
  clear(content);
  return content;
}

function closeDrawer() {
  $("drawer").classList.remove("on");
  $("drawer").setAttribute("aria-hidden", "true");
  $("scrim").classList.remove("on");
}

function section(title) {
  const node = el("section");
  node.append(el("h3", null, title));
  return node;
}

function openPlan(turn) {
  const plan = turn.plan || {};
  const content = openDrawer("plano · turno " + String(turn.turn_index));

  const head = section("objetivo");
  head.append(el("div", null, plan.objective || "—"));
  head.append(dl([
    ["as_of", plan.as_of],
    ["escopo", plan.scope],
    ["plan_id", plan.plan_id],
    ["question_id", plan.question_id],
  ]));
  content.append(head);

  const steps = plan.steps || [];
  if (steps.length) {
    const box = section("passos (" + String(steps.length) + ")");
    const table = el("table");
    const header = el("tr");
    for (const label of ["step_id", "tipo", "métrica / op", "empresa", "período"]) {
      header.append(el("th", null, label));
    }
    const thead = el("thead");
    thead.append(header);
    table.append(thead);
    const tbody = el("tbody");
    for (const step of steps) {
      const tr = el("tr");
      tr.append(el("td", "m", step.step_id || ""));
      tr.append(el("td", null, step.step_kind || ""));
      tr.append(el("td", "m", step.metric || step.op || ""));
      const who = step.entity_name || (step.entity_id ? entityLabel(step.entity_id) : "");
      const inputs = (step.inputs || []).join(", ");
      tr.append(el("td", null, who || (inputs ? "insumos: " + inputs : "")));
      tr.append(el("td", "m", step.period_end || ""));
      tbody.append(tr);
    }
    table.append(tbody);
    box.append(table);
    content.append(box);
  }

  const outputs = plan.outputs || [];
  if (outputs.length) {
    const box = section("saídas");
    box.append(el("div", "mono", outputs.join(" · ")));
    content.append(box);
  }
  const assumptions = plan.assumptions || [];
  if (assumptions.length) {
    const box = section("premissas");
    const list = el("ul");
    for (const item of assumptions) list.append(el("li", null, item));
    box.append(list);
    content.append(box);
  }
  const unresolved = plan.unresolved || [];
  if (unresolved.length) {
    const box = section("pendências");
    const list = el("ul");
    for (const item of unresolved) {
      const li = el("li");
      li.append(el("span", "mono", item.kind || "?"));
      li.append(el("span", null, " · " + (item.detail || "")));
      const candidates = item.candidates || [];
      if (candidates.length) li.append(el("div", "faint", "candidatos: " + candidates.join(", ")));
      list.append(li);
    }
    box.append(list);
    content.append(box);
  }

  content.append(reproBlock(turn));
}

/* O bloco que justifica o endpoint existir (§16): o JSON baixado e
   exatamente o formato que `pat ask --plan-file` aceita. Sem --writer, o
   comando reproduz os mesmos numeros sem nenhuma chamada de modelo — a
   prova mais direta de que este chat e uma casca sobre um pipeline que
   roda sem ele. */
function reproBlock(turn) {
  const box = section("reproduzir sem o chat");
  const repro = el("div", "repro");
  repro.append(el("p",
    null,
    "Este plano é um arquivo. Baixe-o e rode o pipeline determinístico no " +
    "terminal: sem --writer não há nenhuma chamada de modelo, e os números " +
    "saem idênticos. O chat não é fonte de verdade."));
  const url = location.origin && location.origin !== "null"
    ? location.origin
    : "http://localhost:8765";
  const command =
    "curl " + url + "/api/turn/" + String(turn.session_id) + "/" +
    String(turn.turn_index) + "/plan > p.json\n" +
    "pat ask --plan-file p.json";
  repro.append(el("pre", "cmd", command));
  const actions = el("div", "actions");
  const copy = el("button", null, "copiar comando");
  const done = el("span", "copied");
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(command); done.textContent = "copiado"; }
    catch (err) { done.textContent = "selecione e copie"; }
    setTimeout(() => { done.textContent = ""; }, 1800);
  });
  const open = el("a", null, "abrir o JSON");
  open.href = "/api/turn/" + encodeURIComponent(String(turn.session_id)) + "/" +
              encodeURIComponent(String(turn.turn_index)) + "/plan";
  open.target = "_blank";
  open.rel = "noopener";
  actions.append(copy, done, open);
  repro.append(actions);
  box.append(repro);
  return box;
}

function openSources(turn) {
  const content = openDrawer("fontes · turno " + String(turn.turn_index));
  const answer = turn.answer || {};
  const numeric = answer.numeric_claims || [];

  if (numeric.length) {
    const box = section("números citados");
    for (const claim of numeric) {
      const item = el("div", "claim");
      const top = el("div", "top");
      top.append(el("span", "mono", claim.token || ""));
      top.append(el("span", "faint", "→"));
      // rendered_value vai para a tela EXATAMENTE como veio de render.py.
      // Nao ha reformatacao aqui, nem sequer de unidade.
      top.append(el("span", "val", claim.rendered_value === null ? "—" : String(claim.rendered_value)));
      if (claim.unit) top.append(el("span", "faint mono", claim.unit));
      item.append(top);
      if (claim.means) item.append(el("div", "means", claim.means));
      if (claim.step_id) item.append(el("div", "faint mono", "step " + claim.step_id));
      if (claim.result_id) {
        const line = el("div");
        line.append(el("span", "faint", "result_id "));
        line.append(copyButton(claim.result_id));
        item.append(line);
      }
      box.append(item);
    }
    content.append(box);
  }

  const manifest = turn.manifest;
  if (manifest) {
    const box = section("manifesto");
    const idline = el("div");
    idline.append(el("span", "faint", "manifest_id "));
    idline.append(copyButton(manifest.manifest_id));
    box.append(idline);
    box.append(dl([
      ["capability", manifest.capability_sha256],
      ["executado em", manifest.executed_at],
      ["métricas", (manifest.metric_versions || []).join(" · ")],
      ["mapeamentos", (manifest.mapping_sha256s || []).map((h) => short(h, 12)).join(" · ")],
      ["saídas disponíveis", manifest.outputs_available === undefined
        ? "" : (manifest.outputs_available ? "sim" : "não")],
      ["fatos folha", String((manifest.fact_ids || []).length)],
      ["resultados", String((manifest.result_ids || []).length)],
      ["pat", manifest.pat_version],
      ["git", manifest.git_sha],
      ["python", manifest.python_version],
    ]));
    const note = el("div", "faint");
    note.textContent =
      "Confira no terminal: pat runs --research " + String(manifest.manifest_id || "<id>");
    box.append(note);
    content.append(box);
  }

  const provenance = turn.provenance || {};
  if (provenance.planner || provenance.writer) {
    const box = section("procedência");
    for (const [role, label] of [["planner", "planejador"], ["writer", "escritor"]]) {
      const call = provenance[role];
      const sub = el("div", "claim");
      sub.append(el("div", null, label));
      if (!call) {
        sub.append(el("div", "faint", "sem chamada"));
      } else {
        sub.append(dl([
          ["modelo", call.model_id],
          ["fingerprint", call.client_fingerprint],
          ["cache", call.cached ? "sim" : "não"],
          // temperatura sai do backend como STRING (Decimal no contrato) e e
          // exibida como veio: converter para numero aqui reintroduziria
          // binario justamente na ponta em que ninguem olharia.
          ["temperatura", call.temperature === undefined || call.temperature === null
            ? "" : String(call.temperature)],
          ["system prompt", call.system_prompt_sha256 ? short(call.system_prompt_sha256, 12) : ""],
          ["prompt", short(call.prompt_sha256, 12)],
          ["resposta", short(call.response_sha256, 12)],
          ["chamado em", call.called_at],
          ["max_tokens", call.max_tokens === undefined || call.max_tokens === null
            ? "" : String(call.max_tokens)],
        ]));
      }
      box.append(sub);
    }
    content.append(box);
  }

  const warnings = (turn.answer && turn.answer.warnings) || [];
  if (warnings.length) {
    const box = section("ressalvas");
    const list = el("ul");
    for (const warning of warnings) {
      const li = el("li");
      li.append(el("span", "mono", warning.kind || "?"));
      li.append(el("span", null, " · " + (warning.message || "")));
      if (warning.result_id) li.append(el("span", "faint mono", " " + short(warning.result_id, 10)));
      list.append(li);
    }
    box.append(list);
    content.append(box);
  }

  if (turn.context_sha256) {
    const box = section("contexto da conversa");
    box.append(el("div", "faint",
      "O planejador recebeu apenas a estrutura dos turnos anteriores — empresas, " +
      "métricas, períodos, escopo e desfecho. Nenhum valor viaja no contexto."));
    box.append(dl([["context_sha256", turn.context_sha256]]));
    content.append(box);
  }
}

}

});

  event.target.value = "";
});

});

  try { await newSession(); } catch (err) { $("thread").append(renderInfraError(err, "")); }
});
$("btn-close").addEventListener("click", closeDrawer);

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeDrawer();
});

/* -------------------------------- boot -------------------------------- */

async function boot() {
  try {
    await loadCapability();
  } catch (err) {
    $("thread").append(renderInfraError(err, ""));
  }
  // Sessao no fragmento da URL: recarregar a aba nao perde a conversa, e o
  // link continua sendo local. Se a sessao nao existir mais, cria uma nova.
  const fromHash = location.hash.replace("#", "");
  try {
    if (fromHash && !MOCK) await resumeSession(fromHash);
    else await newSession();
  } catch (err) {
    try { await newSession(); } catch (err2) { $("thread").append(renderInfraError(err2, "")); }
  }
  renderPins();
  $("input").focus();
}
